<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" name="viewport" content="user-scalable=no">
  <title>Game</title>
  <link rel="stylesheet" href="./css/index.css">

</head>

<body>
  <div id="setas" class="controles">
    <button id="tab" class="mover" aria-label="Inventário">Inv</button>
    <button id="interagir" class="mover" aria-label="Interagir">E</button>
    <button id="comer" class="mover" aria-label="Comer">F</button>

    <button id="cima" class="mover" aria-label="Mover para cima">↑</button>
    <button id="baixo" class="mover" aria-label="Mover para baixo">↓</button>
    <button id="esquerda" class="mover" aria-label="Mover para esquerda">←</button>
    <button id="direita" class="mover" aria-label="Mover para direita">→</button>
  </div>
  <script>
    const teclas = {
      tab: "Tab",
      interagir: "e",
      comer: "f",
      cima: "w",
      baixo: "s",
      esquerda: "a",
      direita: "d"
    };

    for (const [id, tecla] of Object.entries(teclas)) {
      const botao = document.getElementById(id);

      let intervalo = null;

      function pressionar() {
        if (intervalo !== null) return;

        // Envia imediatamente
        document.dispatchEvent(new KeyboardEvent("keydown", {
          key: tecla,
          bubbles: true
        }));

        // Repete enquanto estiver pressionado
        intervalo = setInterval(() => {
          document.dispatchEvent(new KeyboardEvent("keydown", {
            key: tecla,
            bubbles: true
          }));
        }, 100);
      }

      function soltar() {
        if (intervalo !== null) {
          clearInterval(intervalo);
          intervalo = null;
        }

        document.dispatchEvent(new KeyboardEvent("keyup", {
          key: tecla,
          bubbles: true
        }));
      }

      // Mouse
      botao.addEventListener("mousedown", pressionar);
      botao.addEventListener("mouseup", soltar);
      botao.addEventListener("mouseleave", soltar);

      // Celular
      botao.addEventListener("touchstart", (event) => {
        event.preventDefault();
        pressionar();
      }, { passive: false });

      botao.addEventListener("touchend", soltar);
      botao.addEventListener("touchcancel", soltar);
    }
  </script>

  <div id="tempo"></div>
  
  <div id="morte" class="morte">
    <p>Você Morreu</p>
    <button id="recomecar">recomeçar</button>

  </div>
  <div class="table3x3" id="table3x3"></div>
  <div class="table3x3 result" id="table3x3-result"></div>
  <div class="boneco" id="boneco"></div>
  <div class="desktop">
    <div id="agrupamento">
      <div class="result" id="result"></div>
      <div class="table2x2" id="table2x2"></div>
    </div>
    <div class="inventario" id="inventario"></div>
  </div>

  <div class="hotbar" id="hotbar"></div>

  <div class="infos">
    <div class="fome" , id="fome"></div>
    <div class="vida" , id="vida"></div>
  </div>
  <script type="module" src="./js/script.js"></script>
</body>

</html>
